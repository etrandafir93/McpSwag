spring:
  application:
    name: mcpswag
  ai:
    mcp:
      server:
        name: mcpswag
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC

server:
  port: 8080

swagger-mcp:
  http:
    timeout-seconds: 30
    max-body-bytes: 262144
  # scan-dir: ./specs   ← default; drop .yml/.yaml/.json files there and they load automatically
  # sources:            ← optional explicit list (URLs or absolute file paths)
  #   - name: petstore
  #     url: https://petstore3.swagger.io/api/v3/openapi.json

logging:
  level:
    root: INFO
    com.etrandafir.mcpswag: DEBUG
