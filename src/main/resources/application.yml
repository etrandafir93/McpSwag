spring:
  application:
    name: mcpswag
  config:
    # Optional external config file. If MCPSWAG_CONFIG is set, that YAML file
    # is layered on top of these defaults (overriding swagger-mcp.sources etc).
    # If unset, the import is a no-op.
    import: "optional:file:${MCPSWAG_CONFIG:}"
  ai:
    mcp:
      server:
        name: mcpswag
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        instructions: "McpSwag — OpenAPI → MCP gateway. Phase 0: only the hello tool is exposed."

server:
  port: 8080

swagger-mcp:
  http:
    timeout-seconds: 30
    max-body-bytes: 262144
  sources:
    - name: petstore
      file: classpath:openapi/petstore.yml

logging:
  level:
    root: INFO
    com.etrandafir.mcpswag: DEBUG
